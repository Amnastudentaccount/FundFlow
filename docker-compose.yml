version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundflow
      POSTGRES_PASSWORD: fundflow
      POSTGRES_DB: fundflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundflow"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://fundflow:fundflow@db:5432/fundflow
      - PAYPAL_MOCK_MODE=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: