services:
  - type: web
    name: fundflow
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PAYPAL_MOCK_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fundflow-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

databases:
  - name: fundflow-db
    plan: free
    databaseName: fundflow
    user: fundflow